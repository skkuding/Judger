version: '3'
services:
  devcontainer:
    profiles: ['devcontainer']
    image: judger-devcontainer-alpine
    container_name: judger-dev
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    volumes:
      - ..:/workspace:cached
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    stdin_open: true
    tty: true
    environment:
      DEVCONTAINER: 1
    network_mode: host
    privileged: true
    cgroup: host